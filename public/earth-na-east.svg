<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <filter id="naeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="naeOcean" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#03487c" />
      <stop offset="100%" stop-color="#021f38" />
    </radialGradient>
    <radialGradient id="naeSphereShade" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="75%" stop-color="#010e1a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#010810" stop-opacity="0.95" />
    </radialGradient>
    <clipPath id="naeGlobeClip">
      <circle cx="80" cy="80" r="68" />
    </clipPath>
  </defs>

  <circle cx="80" cy="80" r="74" fill="#0ea5e9" opacity="0.32" filter="url(#naeGlow)" />
  <circle cx="80" cy="80" r="68" fill="url(#naeOcean)" />

  <g clip-path="url(#naeGlobeClip)" opacity="0.95">
    <!-- North America East Coast & Great Lakes -->
    <path d="M 30 38 Q 50 32 68 40 Q 82 50 78 70 Q 72 84 62 96 Q 52 92 48 80 Q 44 65 30 52 Z" fill="#22c55e" />
    <!-- Florida Peninsula -->
    <path d="M 64 92 Q 68 96 66 106 Q 62 104 62 92 Z" fill="#86efac" />
    <!-- Atlantic Ocean in center, with Europe / Africa visible on the right -->
    <path d="M 120 40 Q 138 35 146 50 Q 136 68 124 64 Z" fill="#4ade80" />
    <path d="M 122 80 Q 140 82 144 110 Q 128 130 115 110 Z" fill="#eab308" opacity="0.8" />
    <!-- Caribbean Islands -->
    <circle cx="70" cy="112" r="3" fill="#6ee7b7" />
    <circle cx="78" cy="116" r="2.5" fill="#6ee7b7" />
    <!-- Clouds -->
    <path d="M 30 55 Q 65 48 100 56 Q 130 62 145 58" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.32" />
    <path d="M 50 95 Q 85 102 120 96" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.25" />
  </g>

  <circle cx="80" cy="80" r="68" fill="url(#naeSphereShade)" />
  <circle cx="80" cy="80" r="67.5" fill="none" stroke="#67e8f9" stroke-width="1.2" opacity="0.75" />
</svg>

