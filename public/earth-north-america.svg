<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <filter id="naGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="naOcean" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#03487c" />
      <stop offset="100%" stop-color="#021f38" />
    </radialGradient>
    <radialGradient id="naSphereShade" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="75%" stop-color="#010e1a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#010810" stop-opacity="0.95" />
    </radialGradient>
    <clipPath id="naGlobeClip">
      <circle cx="80" cy="80" r="68" />
    </clipPath>
  </defs>

  <circle cx="80" cy="80" r="74" fill="#0ea5e9" opacity="0.32" filter="url(#naGlow)" />
  <circle cx="80" cy="80" r="68" fill="url(#naOcean)" />

  <g clip-path="url(#naGlobeClip)" opacity="0.95">
    <!-- Alaska & Canada -->
    <path d="M 32 34 Q 50 20 85 24 Q 115 28 126 44 Q 105 52 90 48 Q 70 54 50 48 Q 36 44 32 34 Z" fill="#4ade80" />
    <!-- Continental USA & Rocky Mountains / West -->
    <path d="M 48 50 Q 82 48 108 58 Q 112 76 96 90 Q 76 94 62 84 Q 50 78 48 50 Z" fill="#22c55e" />
    <!-- Mexico & Central America -->
    <path d="M 64 86 Q 78 90 82 104 Q 86 116 80 126 Q 74 122 72 108 Q 62 98 64 86 Z" fill="#10b981" />
    <!-- Greenland -->
    <path d="M 116 22 Q 134 22 136 34 Q 128 42 118 38 Z" fill="#e2e8f0" opacity="0.9" />
    <!-- Clouds -->
    <path d="M 35 48 Q 65 42 95 50 Q 125 56 140 50" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.32" />
    <path d="M 55 90 Q 85 96 115 90" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.25" />
  </g>

  <circle cx="80" cy="80" r="68" fill="url(#naSphereShade)" />
  <circle cx="80" cy="80" r="67.5" fill="none" stroke="#67e8f9" stroke-width="1.2" opacity="0.75" />
</svg>

